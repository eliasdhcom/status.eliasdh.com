<section class="cookie-banner" *ngIf="visible()" role="region" aria-labelledby="cookie-title">
    <h3 class="cookie-title" id="cookie-title">{{'COOKIE-CONSENT.TITLE' | translate}}</h3>
    <p class="cookie-text">{{'COOKIE-CONSENT.TEXT' | translate}}</p>
    <p class="cookie-links">
        <a [href]="mainSite('/privacypolicy')" target="_blank" rel="noopener">{{'COOKIE-CONSENT.PRIVACY-LINK' | translate}}</a>
        <a [href]="mainSite('/legalguidelines')" target="_blank" rel="noopener">{{'COOKIE-CONSENT.LEGAL-LINK' | translate}}</a>
    </p>
    <div class="cookie-buttons">
        <button type="button" class="cookie-button cookie-button-secondary" (click)="decline()">
            {{'COOKIE-CONSENT.DECLINE' | translate}}
        </button>
        <button type="button" class="cookie-button" (click)="accept()">
            {{'COOKIE-CONSENT.ACCEPT' | translate}}
        </button>
    </div>
</section>
