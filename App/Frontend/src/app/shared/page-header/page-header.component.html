<header class="page-header">
    <div class="page-header-inner">
        <ng-template #backContent>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            <span>{{ backLabelKey | translate }}</span>
        </ng-template>
        @if (backHref) {
            <a [href]="backHref" class="page-header-back" [attr.aria-label]="backLabelKey | translate">
                <ng-container *ngTemplateOutlet="backContent"></ng-container>
            </a>
        } @else {
            <a [routerLink]="backRoute | localize" class="page-header-back" [attr.aria-label]="backLabelKey | translate">
                <ng-container *ngTemplateOutlet="backContent"></ng-container>
            </a>
        }
        <h1 class="page-header-title">{{ titleKey | translate }}</h1>
    </div>
</header>
