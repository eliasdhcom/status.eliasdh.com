<!--Author EliasDH Team-->
<div class="sd" [class.sd-bare]="bare()">
    <svg class="sd-svg" viewBox="0 0 480 320" role="img" [attr.aria-label]="label() | translate" preserveAspectRatio="xMidYMid meet">
        @switch (kind()) {
            @case ('web') {
                <g class="a-up">
                    <rect class="sd-card" x="20" y="24" width="336" height="236" rx="12"/>
                    <circle cx="40" cy="42" r="4.5" class="sd-dot sd-dot-1"/>
                    <circle cx="54" cy="42" r="4.5" class="sd-dot sd-dot-2"/>
                    <circle cx="68" cy="42" r="4.5" class="sd-dot sd-dot-3"/>
                    <rect class="sd-skel" x="88" y="33" width="212" height="18" rx="9"/>
                    <path class="sd-stroke-ok" d="M99.5 40.5v-2a3 3 0 0 1 6 0v2M98 40.5h9v6h-9z"/>
                    <text x="113" y="46" class="fs-10 sd-muted">{{ domain() }}.be</text>
                    <line x1="20" y1="60" x2="356" y2="60" class="sd-line"/>
                    <rect x="36" y="72" width="14" height="14" rx="4" class="sd-cta"/>
                    <rect x="58" y="76" width="44" height="6" rx="3" class="sd-skel-strong"/>
                    <rect x="216" y="76" width="24" height="6" rx="3" class="sd-skel"/>
                    <rect x="248" y="76" width="24" height="6" rx="3" class="sd-skel"/>
                    <rect x="280" y="76" width="24" height="6" rx="3" class="sd-skel"/>
                    <rect x="312" y="72" width="30" height="14" rx="7" class="sd-tint"/>
                    <rect class="sd-ink-soft a-draw-x" x="36" y="102" width="156" height="12" rx="6" style="--d: .25s"/>
                    <rect class="sd-accent a-draw-x" x="36" y="120" width="116" height="12" rx="6" style="--d: .35s"/>
                    <rect class="sd-skel-strong a-draw-x" x="36" y="144" width="166" height="6" rx="3" style="--d: .45s"/>
                    <rect class="sd-skel-strong a-draw-x" x="36" y="156" width="136" height="6" rx="3" style="--d: .5s"/>
                    <g class="a-pop" style="--d: .6s">
                        <rect class="sd-cta" x="36" y="174" width="76" height="22" rx="11"/>
                        <rect class="sd-on-cta-soft" x="50" y="182.5" width="48" height="5" rx="2.5"/>
                    </g>
                    <g class="a-fade" style="--d: .4s">
                        <rect class="sd-tint" x="216" y="96" width="124" height="100" rx="10"/>
                        <circle cx="306" cy="120" r="9" class="sd-accent-soft"/>
                        <path d="M226 186l30-34 22 22 14-14 38 26z" class="sd-accent-soft"/>
                    </g>
                    <g class="a-up" style="--d: .7s"><rect class="sd-skel" x="36" y="212" width="94" height="34" rx="8"/><circle cx="52" cy="229" r="6" class="sd-accent-soft"/><rect x="64" y="226" width="50" height="6" rx="3" class="sd-skel-strong"/></g>
                    <g class="a-up" style="--d: .78s"><rect class="sd-skel" x="138" y="212" width="94" height="34" rx="8"/><circle cx="154" cy="229" r="6" class="sd-accent-soft"/><rect x="166" y="226" width="50" height="6" rx="3" class="sd-skel-strong"/></g>
                    <g class="a-up" style="--d: .86s"><rect class="sd-skel" x="240" y="212" width="94" height="34" rx="8"/><circle cx="256" cy="229" r="6" class="sd-accent-soft"/><rect x="268" y="226" width="50" height="6" rx="3" class="sd-skel-strong"/></g>
                </g>
                <circle cx="74" cy="185" r="14" class="sd-ring web-ring"/>
                <g transform="translate(74 186)">
                    <g class="web-cursor">
                        <path d="M0 0v15l4-4 3 6.5 2.5-1.1-2.9-6.2H12z" class="sd-cursor"/>
                    </g>
                </g>
                <g class="a-pop" style="--d: .55s">
                    <rect class="sd-card sd-float" x="296" y="150" width="164" height="124" rx="12"/>
                    <text x="312" y="174" class="fs-10 fw-7 sd-muted">{{ 'SERVICES.DIAGRAM.SPEED' | translate }}</text>
                    <circle cx="342" cy="224" r="26" class="sd-gauge-bg"/>
                    <circle cx="342" cy="224" r="26" class="sd-gauge web-gauge" pathLength="100" transform="rotate(-90 342 224)"/>
                    <text x="342" y="229.5" text-anchor="middle" class="fs-15 fw-9 sd-ink">98</text>
                    <text x="384" y="208" class="fs-9 sd-muted">SEO</text>
                    <text x="384" y="222" class="fs-12 fw-7 sd-ok-text">100</text>
                    <text x="384" y="244" class="fs-9 sd-muted">{{ 'SERVICES.DIAGRAM.MOBILE' | translate }}</text>
                    <g transform="translate(390 254)"><path d="M-4 0l3 3 5.5-6" class="sd-stroke-ok sd-stroke-bold"/></g>
                </g>
            }

            @case ('mail') {
                <g class="a-up">
                    <rect class="sd-card" x="20" y="28" width="236" height="264" rx="12"/>
                    <text x="38" y="57" class="fs-14 fw-9 sd-ink">{{ 'SERVICES.DIAGRAM.INBOX' | translate }}</text>
                    <text x="38" y="74" class="fs-10 sd-muted">info&#64;{{ domain() }}.be</text>
                    <rect x="206" y="45" width="34" height="18" rx="9" class="sd-cta"/>
                    <text x="223" y="57.5" text-anchor="middle" class="fs-10 fw-7 sd-on-cta">4</text>
                    <line x1="20" y1="86" x2="256" y2="86" class="sd-line"/>
                    <rect x="26" y="92" width="224" height="44" rx="8" class="sd-tint mail-hl"/>
                </g>
                @for (row of mailRows; track row.name; let i = $index) {
                    <g [class]="i === 0 ? 'mail-new' : 'a-up'" [style.--d]="(0.2 + i * 0.1) + 's'">
                        <circle cx="44" [attr.cy]="114 + i * 48" r="13" [attr.fill]="row.color"/>
                        <text x="44" [attr.y]="118 + i * 48" text-anchor="middle" class="fs-11 fw-7 sd-white">{{ row.initial }}</text>
                        <text x="66" [attr.y]="110 + i * 48" class="fs-11 fw-7 sd-ink">{{ row.name }}</text>
                        <rect x="66" [attr.y]="118 + i * 48" [attr.width]="row.width" height="6" rx="3" class="sd-skel-strong"/>
                        <text x="238" [attr.y]="110 + i * 48" text-anchor="end" class="fs-9 sd-muted">{{ row.time }}</text>
                        @if (i === 0) {
                            <circle cx="234" cy="122" r="3.5" class="sd-cta"/>
                        }
                        @if (i < 3) {
                            <line x1="38" [attr.y1]="138 + i * 48" x2="240" [attr.y2]="138 + i * 48" class="sd-line"/>
                        }
                    </g>
                }
                <path d="M256 68H318" class="sd-flow"/>
                <path d="M256 148H318" class="sd-flow"/>
                <circle cx="256" cy="68" r="3.5" class="sd-cta sd-packet mail-packet"/>
                <circle cx="256" cy="148" r="3.5" class="sd-cta sd-packet mail-packet" style="animation-delay: 1.6s"/>
                <g class="a-pop" style="--d: .35s">
                    <rect class="sd-card sd-float" x="318" y="36" width="142" height="64" rx="12"/>
                    <path d="M338 56h22a2 2 0 0 1 2 2v12h-26V58a2 2 0 0 1 2-2zM332 74h34" class="sd-stroke-accent"/>
                    <text x="376" y="64" class="fs-11 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.LAPTOP' | translate }}</text>
                    <g transform="translate(380 76)"><path d="M-3 0l2.2 2.2 4-4.4" class="sd-stroke-ok"/></g>
                    <text x="388" y="80" class="fs-9 sd-ok-text">{{ 'SERVICES.DIAGRAM.SYNCED' | translate }}</text>
                </g>
                <g class="a-pop" style="--d: .45s">
                    <rect class="sd-card sd-float" x="318" y="116" width="142" height="64" rx="12"/>
                    <path d="M343 130h12a2 2 0 0 1 2 2v28a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-28a2 2 0 0 1 2-2zM347 157h4" class="sd-stroke-accent"/>
                    <text x="376" y="144" class="fs-11 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.PHONE' | translate }}</text>
                    <g transform="translate(380 156)"><path d="M-3 0l2.2 2.2 4-4.4" class="sd-stroke-ok"/></g>
                    <text x="388" y="160" class="fs-9 sd-ok-text">{{ 'SERVICES.DIAGRAM.SYNCED' | translate }}</text>
                </g>
                <g class="a-pop" style="--d: .6s">
                    <rect class="sd-card sd-float" x="290" y="200" width="170" height="92" rx="12"/>
                    <path d="M314 212l9 3.5v6c0 5.5-3.8 9.5-9 11-5.2-1.5-9-5.5-9-11v-6z" class="sd-tint sd-stroke-accent-fill"/>
                    <path d="M310.5 222.5l2.5 2.5 4.5-5" class="sd-stroke-accent"/>
                    <text x="332" y="227" class="fs-11 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.PROTECTED' | translate }}</text>
                    <g class="a-pop" style="--d: .85s"><rect x="302" y="246" width="44" height="26" rx="8" class="sd-ok-tint"/><text x="324" y="263" text-anchor="middle" class="fs-9 fw-7 sd-ok-text">SPF</text></g>
                    <g class="a-pop" style="--d: .95s"><rect x="352" y="246" width="48" height="26" rx="8" class="sd-ok-tint"/><text x="376" y="263" text-anchor="middle" class="fs-9 fw-7 sd-ok-text">DKIM</text></g>
                    <g class="a-pop" style="--d: 1.05s"><rect x="406" y="246" width="46" height="26" rx="8" class="sd-ok-tint"/><text x="429" y="263" text-anchor="middle" class="fs-9 fw-7 sd-ok-text">DMARC</text></g>
                </g>
            }

            @case ('domains') {
                <g class="a-up">
                    <rect class="sd-card sd-float" x="20" y="24" width="440" height="52" rx="26"/>
                    <circle cx="47" cy="48" r="7" class="sd-stroke-muted"/>
                    <path d="M52 53l5 5" class="sd-stroke-muted"/>
                    <text x="70" y="55" class="fs-15 sd-ink" [attr.textLength]="domainWidth()" lengthAdjust="spacing">{{ domain() }}</text>
                    <rect class="sd-card-fill dom-cover" x="69" y="34" [attr.width]="domainWidth() + 4" height="30" [style.--n]="domain().length"/>
                    <rect class="sd-accent dom-caret" [attr.x]="72 + domainWidth()" y="38" width="1.6" height="21" [style.--n]="domain().length" [style.--w]="domainWidth()"/>
                    <rect x="372" y="32" width="80" height="36" rx="18" class="sd-cta"/>
                    <text x="412" y="54" text-anchor="middle" class="fs-12 fw-7 sd-on-cta">{{ 'SERVICES.DIAGRAM.SEARCH' | translate }}</text>
                </g>
                <g class="a-up" style="--d: 1.3s">
                    <rect class="sd-card" x="20" y="92" width="262" height="204" rx="12"/>
                    <rect x="26" y="99" width="250" height="40" rx="8" class="sd-tint dom-pick"/>
                    @for (row of domainRows; track row.tld; let i = $index) {
                        <g class="a-up" [style.--d]="(1.4 + i * 0.1) + 's'">
                            <text x="38" [attr.y]="124 + i * 46" class="fs-13 fw-7 sd-ink">{{ domain() }}<tspan class="sd-accent-text">{{ row.tld }}</tspan></text>
                            @if (row.free) {
                                <rect x="186" [attr.y]="108 + i * 46" width="82" height="22" rx="11" class="sd-ok-tint"/>
                                <text x="227" [attr.y]="122.5 + i * 46" text-anchor="middle" class="fs-9 fw-7 sd-ok-text">{{ 'SERVICES.DIAGRAM.AVAILABLE' | translate }}</text>
                            } @else {
                                <rect x="186" [attr.y]="108 + i * 46" width="82" height="22" rx="11" class="sd-bad-tint"/>
                                <text x="227" [attr.y]="122.5 + i * 46" text-anchor="middle" class="fs-9 fw-7 sd-bad-text">{{ 'SERVICES.DIAGRAM.TAKEN' | translate }}</text>
                            }
                            @if (i < 3) {
                                <line x1="38" [attr.y1]="142 + i * 46" x2="266" [attr.y2]="142 + i * 46" class="sd-line"/>
                            }
                        </g>
                    }
                </g>
                <path d="M282 119H300" class="sd-flow"/>
                <g class="a-up" style="--d: 1.8s">
                    <rect class="sd-card" x="300" y="92" width="160" height="204" rx="12"/>
                    <text x="316" y="119" class="fs-11 fw-9 sd-ink">DNS</text>
                    <circle cx="444" cy="115" r="4" class="sd-ok dom-live"/>
                    @for (row of dnsRows; track row.type; let i = $index) {
                        <g class="a-pop" [style.--d]="(2 + i * 0.12) + 's'">
                            <rect x="314" [attr.y]="134 + i * 38" width="46" height="24" rx="6" class="sd-tint"/>
                            <text x="337" [attr.y]="150 + i * 38" text-anchor="middle" class="fs-9 fw-9 sd-accent-text">{{ row.type }}</text>
                            <text x="368" [attr.y]="150 + i * 38" class="fs-10 sd-muted sd-mono">{{ row.value }}</text>
                        </g>
                    }
                </g>
            }

            @case ('webapps') {
                <g class="a-up">
                    <rect class="sd-card" x="20" y="20" width="440" height="280" rx="12"/>
                    <path d="M32 20.5h76v279H32A11.5 11.5 0 0 1 20.5 288V32A11.5 11.5 0 0 1 32 20.5z" class="sd-skel"/>
                    <rect x="34" y="36" width="16" height="16" rx="5" class="sd-cta"/>
                    <rect x="56" y="41" width="36" height="6" rx="3" class="sd-skel-strong"/>
                    <rect x="28" y="88" width="72" height="22" rx="7" class="sd-tint"/>
                    @for (y of [72, 96, 120, 144, 168]; track y; let i = $index) {
                        <rect x="38" [attr.y]="y - 4" width="8" height="8" rx="2" [class]="i === 1 ? 'sd-accent' : 'sd-skel-strong'"/>
                        <rect x="52" [attr.y]="y - 2.5" [attr.width]="i === 1 ? 38 : 30 + (i % 3) * 6" height="5" rx="2.5" [class]="i === 1 ? 'sd-accent' : 'sd-skel-strong'"/>
                    }
                    <g class="a-up" style="--d: .2s">
                        <rect class="sd-card" x="124" y="36" width="100" height="58" rx="10"/>
                        <text x="136" y="56" class="fs-9 sd-muted">{{ 'SERVICES.DIAGRAM.BOOKINGS' | translate }}</text>
                        <text x="136" y="80" class="fs-15 fw-9 sd-ink">128</text>
                    </g>
                    <g class="a-up" style="--d: .28s">
                        <rect class="sd-card" x="236" y="36" width="100" height="58" rx="10"/>
                        <text x="248" y="56" class="fs-9 sd-muted">{{ 'SERVICES.DIAGRAM.CUSTOMERS' | translate }}</text>
                        <text x="248" y="80" class="fs-15 fw-9 sd-ink">342</text>
                    </g>
                    <g class="a-up" style="--d: .36s">
                        <rect class="sd-card" x="348" y="36" width="100" height="58" rx="10"/>
                        <text x="360" y="56" class="fs-9 sd-muted">{{ 'SERVICES.DIAGRAM.REVENUE' | translate }}</text>
                        <text x="360" y="80" class="fs-15 fw-9 sd-ink">€ 18k</text>
                    </g>
                    <g class="a-up" style="--d: .3s">
                        <rect class="sd-card" x="124" y="106" width="324" height="182" rx="10"/>
                        <text x="140" y="130" class="fs-10 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.PER_MONTH' | translate }}</text>
                        <text x="432" y="130" text-anchor="end" class="fs-10 fw-7 sd-ok-text">+26%</text>
                        <line x1="140" y1="178" x2="432" y2="178" class="sd-grid"/>
                        <line x1="140" y1="226" x2="432" y2="226" class="sd-grid"/>
                        <line x1="140" y1="272.5" x2="432" y2="272.5" class="sd-line"/>
                        @for (h of chartBars; track $index; let i = $index; let last = $last) {
                            <rect [attr.x]="146 + i * 48" [attr.y]="272 - h" width="36" [attr.height]="h" rx="5" [class]="'a-grow-y ' + (last ? 'sd-cta' : 'sd-bar')" [style.--d]="(0.45 + i * 0.08) + 's'"/>
                        }
                    </g>
                </g>
                <g class="webapp-toast">
                    <rect class="sd-card sd-float" x="140" y="142" width="156" height="32" rx="16"/>
                    <circle cx="158" cy="158" r="8" class="sd-ok-tint"/>
                    <g transform="translate(158 158)"><path d="M-3.5 0l2.5 2.5 4.5-5" class="sd-stroke-ok"/></g>
                    <text x="172" y="161.5" class="fs-10 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.NEW_BOOKING' | translate }}</text>
                </g>
            }

            @case ('pwa') {
                <g class="a-up">
                    <rect class="sd-card" x="20" y="36" width="236" height="212" rx="12"/>
                    <circle cx="38" cy="53" r="4" class="sd-dot sd-dot-1"/>
                    <circle cx="50" cy="53" r="4" class="sd-dot sd-dot-2"/>
                    <circle cx="62" cy="53" r="4" class="sd-dot sd-dot-3"/>
                    <rect class="sd-skel" x="76" y="45" width="166" height="16" rx="8"/>
                    <text x="88" y="56.5" class="fs-9 sd-muted">app.{{ domain() }}.be</text>
                    <line x1="20" y1="70" x2="256" y2="70" class="sd-line"/>
                    <rect x="36" y="84" width="120" height="10" rx="5" class="sd-ink-soft"/>
                    <rect x="36" y="102" width="184" height="6" rx="3" class="sd-skel-strong"/>
                    <rect x="36" y="114" width="150" height="6" rx="3" class="sd-skel-strong"/>
                    <rect x="36" y="130" width="98" height="48" rx="8" class="sd-tint"/>
                    <rect x="142" y="130" width="98" height="48" rx="8" class="sd-skel"/>
                </g>
                <g class="pwa-prompt">
                    <rect class="sd-card sd-float" x="32" y="188" width="212" height="46" rx="10"/>
                    <rect x="42" y="198" width="26" height="26" rx="7" class="sd-cta"/>
                    <path d="M49.5 214.5l5.5-9 5.5 9" class="sd-stroke-white"/>
                    <text x="76" y="209" class="fs-10 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.INSTALL' | translate }}</text>
                    <text x="76" y="223" class="fs-9 sd-muted">{{ domain() }}</text>
                    <g class="pwa-btn">
                        <rect x="206" y="200" width="30" height="22" rx="11" class="sd-cta"/>
                        <path d="M221 205v9M217 210.5l4 4 4-4" class="sd-stroke-white"/>
                    </g>
                </g>
                <path d="M262 150H306" class="sd-flow"/>
                <circle cx="262" cy="150" r="3.5" class="sd-cta sd-packet pwa-packet"/>
                <g class="a-up" style="--d: .3s">
                    <rect class="sd-card sd-float" x="312" y="20" width="148" height="284" rx="24"/>
                    <rect x="320" y="28" width="132" height="268" rx="18" class="sd-skel"/>
                    <rect x="366" y="35" width="40" height="10" rx="5" class="sd-notch"/>
                    @for (y of [62, 106, 150, 194]; track y; let r = $index) {
                        @for (x of [332, 372, 412]; track x; let c = $index) {
                            @if (!(r === 2 && c === 2)) {
                                <rect [attr.x]="x" [attr.y]="y" width="28" height="28" rx="8" class="sd-skel-strong"/>
                            }
                        }
                    }
                    <g class="pwa-icon">
                        <rect x="412" y="150" width="28" height="28" rx="8" class="sd-cta"/>
                        <path d="M420 169l6-10 6 10" class="sd-stroke-white"/>
                    </g>
                    <rect x="330" y="248" width="112" height="36" rx="12" class="sd-skel-strong"/>
                </g>
                <g class="a-pop" style="--d: .7s">
                    <rect class="sd-card" x="20" y="262" width="114" height="30" rx="15"/>
                    <path d="M33 274.5a11 11 0 0 1 14 0M36 278a6 6 0 0 1 8 0M33 270l14 14" class="sd-stroke-accent"/>
                    <text x="54" y="281" class="fs-9 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.OFFLINE' | translate }}</text>
                </g>
                <g class="a-pop" style="--d: .8s">
                    <rect class="sd-card" x="142" y="262" width="114" height="30" rx="15"/>
                    <path d="M154 281h12M156 281v-5a4 4 0 0 1 8 0v5M158.5 284h3" class="sd-stroke-accent"/>
                    <text x="174" y="281" class="fs-9 fw-7 sd-ink">{{ 'SERVICES.DIAGRAM.PUSH' | translate }}</text>
                </g>
            }

            @case ('mobile') {
                @for (phone of [{ x: 56, ios: true }, { x: 284, ios: false }]; track phone.x; let p = $index) {
                    <g class="a-up" [style.--d]="(p * 0.15) + 's'">
                        <rect class="sd-card sd-float" [attr.x]="phone.x" y="20" width="140" height="272" [attr.rx]="phone.ios ? 26 : 20"/>
                        <rect [attr.x]="phone.x + 7" y="27" width="126" height="258" [attr.rx]="phone.ios ? 20 : 14" class="sd-skel"/>
                        @if (phone.ios) {
                            <rect [attr.x]="phone.x + 50" y="34" width="40" height="11" rx="5.5" class="sd-notch"/>
                        } @else {
                            <circle [attr.cx]="phone.x + 70" cy="39" r="4.5" class="sd-notch"/>
                        }
                        <rect [attr.x]="phone.x + 21" y="60" width="60" height="8" rx="4" class="sd-ink-soft"/>
                        <circle [attr.cx]="phone.x + 114" cy="64" r="8" class="sd-tint"/>
                        <rect [attr.x]="phone.x + 21" y="80" width="98" height="64" rx="12" class="sd-cta"/>
                        <rect [attr.x]="phone.x + 31" y="92" width="40" height="5" rx="2.5" class="sd-on-cta-soft"/>
                        <path [attr.d]="'M' + (phone.x + 31) + ' 132l14-8 12 5 14-12 14 4 14-10'" class="sd-stroke-white a-draw-x" [style.--d]="(0.5 + p * 0.15) + 's'"/>
                        @for (y of [156, 192, 228]; track y) {
                            <circle [attr.cx]="phone.x + 33" [attr.cy]="y + 14" r="10" class="sd-tint"/>
                            <rect [attr.x]="phone.x + 49" [attr.y]="y + 7" width="52" height="6" rx="3" class="sd-skel-strong"/>
                            <rect [attr.x]="phone.x + 49" [attr.y]="y + 18" width="34" height="5" rx="2.5" class="sd-skel"/>
                        }
                        <g class="mob-notif" [style.animation-delay]="(1.2 + p * 0.3) + 's'">
                            <rect class="sd-card sd-float" [attr.x]="phone.x + 13" y="50" width="114" height="36" rx="10"/>
