name: Check Status and Deploy to GitHub Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: status-pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore history
        run: |
          set +e
          git ls-remote --exit-code --heads origin status-data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --depth=1 origin status-data
            git show FETCH_HEAD:history.json > history.json
          elif [ "$code" -eq 2 ]; then
            echo "No status-data branch yet, starting with an empty history."
          else
            echo "Could not reach the repository (exit code $code)." >&2
            exit "$code"
          fi
      - name: Check websites and webservices
        run: node App/Monitor/src/monitor.js --history history.json --out status.json
      - name: Publish history to the status-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/history"
          cp history.json "$RUNNER_TEMP/history/history.json"
          cd "$RUNNER_TEMP/history"
          git init --quiet --initial-branch=status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit --quiet -m "Update status history"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-data
      - name: Upload status report
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: status.json
          retention-days: 1

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Restore built site
        id: site-cache
        uses: actions/cache@v4
        with:
          path: App/Frontend/dist
          key: site-${{ hashFiles('App/Frontend/package-lock.json', 'App/Frontend/package.json', 'App/Frontend/angular.json', 'App/Frontend/tsconfig*.json', 'App/Frontend/scripts/**', 'App/Frontend/src/**') }}
      - name: Set up Node.js
        if: steps.site-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: App/Frontend/package-lock.json
      - name: Build Angular Application
        if: steps.site-cache.outputs.cache-hit != 'true'
        working-directory: App/Frontend
        run: |
          npm ci
          npm run build
      - name: Download status report
        uses: actions/download-artifact@v4
        with:
          name: status-report
          path: report
      - name: Add status report to the site
        run: |
          mkdir -p App/Frontend/dist/data
          cp report/status.json App/Frontend/dist/data/status.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: App/Frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4