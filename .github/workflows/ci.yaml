name: Test and Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test monitor
        working-directory: App/Monitor
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: App/Frontend/package-lock.json
      - name: Install dependencies
        working-directory: App/Frontend
        run: npm ci
      - name: Build Angular Application
        working-directory: App/Frontend
        run: npm run build